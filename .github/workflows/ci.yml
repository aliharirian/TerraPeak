name: Release & Publish

on:
  push:
    branches:
    - "main"
#    - "fix/**"
#    - "feat/**"
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release (bypass branch restrictions)'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'staging'
        type: choice
        options:
        - staging
        - production

permissions:
  contents: write
  packages: write

env:
  DOCKERHUB_REGISTRY: docker.io
  GO_VERSION: "1.25"

jobs:
  test-go:
    name: Test Go Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cache-hit: ${{ steps.go-cache.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache Go modules
        id: go-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            registry/vendor
          key: ${{ runner.os }}-go-${{ hashFiles('registry/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download Go dependencies
        working-directory: registry
        run: |
          go mod download
          go mod verify
          go mod tidy

      - name: Run Go vet
        working-directory: registry
        run: go vet ./...

      - name: Run Go tests with coverage
        working-directory: registry
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -html=coverage.out -o=coverage.html

  versioning:
    name: Semantic Versioning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-go]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fix/') || github.event.inputs.force_release == 'true'
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      no_new_release: ${{ steps.decide.outputs.no_new_release }}
      released: ${{ steps.decide.outputs.released }}
      changelog: ${{ steps.decide.outputs.changelog }}
      release_type: ${{ steps.decide.outputs.release_type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install semantic-release
        run: |
          npm install -g semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/exec \
            conventional-changelog-conventionalcommits

      - name: Previous tag (before)
        id: before
        run: |
          git fetch --tags --force || true
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "prev=${PREV}" >> $GITHUB_OUTPUT
          echo "Previous tag: ${PREV}"

      - name: Create semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Latest tag (after)
        id: release
        run: |
          git fetch --tags --force
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "Latest tag: ${TAG}; version: ${TAG#v}"

      - name: Decide if a new release was created
        id: decide
        run: |
          if [ "${{ steps.before.outputs.prev }}" = "${{ steps.release.outputs.tag }}" ] || [ -z "${{ steps.release.outputs.tag }}" ]; then
            echo "no_new_release=true" >> $GITHUB_OUTPUT
            echo "released=false" >> $GITHUB_OUTPUT
            echo "changelog=" >> $GITHUB_OUTPUT
            echo "release_type=" >> $GITHUB_OUTPUT
            echo "No new release created."
          else
            echo "no_new_release=false" >> $GITHUB_OUTPUT
            echo "released=true" >> $GITHUB_OUTPUT
            echo "changelog=Release ${{ steps.release.outputs.tag }}" >> $GITHUB_OUTPUT
            echo "release_type=release" >> $GITHUB_OUTPUT
            echo "New release: ${{ steps.release.outputs.tag }}"
          fi

  build-registry-binary:
    name: Build Registry Binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [versioning]
    if: needs.versioning.outputs.no_new_release == 'false' || github.event.inputs.force_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            platform: linux/amd64
          - goos: linux
            goarch: arm64
            platform: linux/arm64
          - goos: darwin
            goarch: amd64
            platform: darwin/amd64
          - goos: darwin
            goarch: arm64
            platform: darwin/arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Restore Go cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('registry/go.sum') }}

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.versioning.outputs.version }}
        working-directory: registry
        run: |
          mkdir -p ../dist
          BINARY_NAME=terrapeak-registry_${GOOS}_${GOARCH}
          
          echo "Building ${BINARY_NAME} for ${GOOS}/${GOARCH}"
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION:-dev} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.gitCommit=${GITHUB_SHA}" \
            -o "../dist/${BINARY_NAME}" \
            .

      - name: Test binary (Linux/macOS only)
        working-directory: dist
        run: |
          BINARY_NAME=terrapeak-registry_${{ matrix.goos }}_${{ matrix.goarch }}
          chmod +x "${BINARY_NAME}"
          ./"${BINARY_NAME}" --version || echo "Version test completed"

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terrapeak-registry-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/terrapeak-registry_${{ matrix.goos }}_${{ matrix.goarch }}*

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [versioning]
    if: needs.versioning.outputs.no_new_release == 'false' || github.event.inputs.force_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: registry
            context: ./registry
            dockerfile: ./registry/Dockerfile
            image: terrapeak-registry
          - name: landing
            context: ./landing
            dockerfile: ./landing/Dockerfile
            image: terrapeak-landing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.versioning.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.versioning.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.versioning.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=TerraPeak ${{ matrix.name }}
            org.opencontainers.image.description=TerraPeak ${{ matrix.name }} component
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ needs.versioning.outputs.version }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.versioning.outputs.version }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}

  release-artifacts:
    name: Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [versioning, build-registry-binary, build-docker-images]
    if: needs.versioning.outputs.released == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-binaries
          pattern: terrapeak-registry-*
          merge-multiple: true

      - name: Create release archive
        run: |
          mkdir -p release
          cd release-binaries
          for file in *; do
            if [[ -f "$file" ]]; then
              tar -czf "../release/${file}.tar.gz" "$file"
              echo "Created archive for $file"
            fi
          done

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.versioning.outputs.tag }}
          draft: ${{ github.ref != 'refs/heads/main' }}
          files: |
            release/*.tar.gz
            CHANGELOG.md
            LICENSE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
