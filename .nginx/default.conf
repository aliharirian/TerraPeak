upstream terrapeak {
    server localhost:8081;
    keepalive 32;
}

# redirect http -> https
server {
    listen 80;
    server_name terrapeak.yourdomain.com;
    return 301 https://$server_name$request_uri;
}

# https reverse proxy
server {
    listen 443 ssl http2;
    server_name terrapeak.yourdomain.com;

    # TLS certs
    ssl_certificate /etc/letsencrypt/live/terrapeak.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/terrapeak.yourdomain.com/privkey.pem;

    # recommended TLS (simple, modern)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # optional security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # proxy to the Go service
    location / {
        proxy_pass http://terrapeak;
        proxy_http_version 1.1;

        # pass through real client info
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connection reuse
        proxy_set_header Connection "";

        # timeouts (increased for better reliability)
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Buffer settings
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Access logging for observability
    access_log /var/log/nginx/terrapeak-access.log combined;
    error_log /var/log/nginx/terrapeak-error.log warn;
}
