server:
  addr: ":8081"
  domain: "http://localhost:8081"
  read_timeout: 15
  write_timeout: 15
  idle_timeout: 60

log:
  level: "info"

terraform:
  registry_url: "https://registry.terraform.io"

storage:
  file:
    enabled: true
    path: "/tmp/registry"
  s3:
    enabled: false

cache:
  allowed_hosts:
    - "registry.terraform.io"

proxy:
  enabled: false
